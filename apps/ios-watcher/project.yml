name: WatcherIOS
options:
  minimumXcodeGenVersion: 2.42.0
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    PRODUCT_BUNDLE_IDENTIFIER: com.claw.watcher.ios
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
configs:
  Debug: debug
  Release: release
targets:
  WatcherIOS:
    type: application
    platform: iOS
    sources:
      - path: WatcherIOS
        excludes:
          - "**/*.md"
    info:
      path: WatcherIOS/Info.plist
    settings:
      base:
        PRODUCT_NAME: WatcherIOS
        INFOPLIST_FILE: WatcherIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - WatcherIOSTests
        - WatcherIOSUITests
      gatherCoverageData: true
      coverageTargets:
        - WatcherIOS

  WatcherIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WatcherIOSTests
    dependencies:
      - target: WatcherIOS
    settings:
      base:
        PRODUCT_NAME: WatcherIOSTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WatcherIOS.app/WatcherIOS

  WatcherIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WatcherIOSUITests
    dependencies:
      - target: WatcherIOS
    settings:
      base:
        PRODUCT_NAME: WatcherIOSUITests
        GENERATE_INFOPLIST_FILE: YES
